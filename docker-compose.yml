services:
  backend:
    build:
      context: ./backend
    container_name: password-manager-backend
    environment:
      SERVER_ADDRESS: ":8080"
      DATABASE_PATH: "/data/vault.db"
      FRONTEND_ORIGIN: "http://localhost:5173"
    volumes:
      - vault-data:/data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: password-manager-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vault-data:
